name: Release

# Push to main ships automatically. Use "Run workflow" for manual control over
# seeding, or publish a GitHub Release to deploy a tagged version.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      seed_mode:
        description: "Guest-list seeding behaviour"
        required: true
        default: if-missing
        type: choice
        options:
          - if-missing # seed only when there is no production database yet
          - never # never touch the guest list
          - force # re-run the seed (upsert — keeps answers, scores, sent flags)

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # pnpm-lock.yaml is the lockfile in this repository, so `npm ci` had
      # nothing to install from — the gate never actually ran.
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        # Nothing ships without the password policy and the invitation capacity
        # rules passing: both decide who gets in.
        run: pnpm test

      - name: Build
        # A throwaway URL: the build only needs Prisma to resolve, never connects.
        env:
          DATABASE_URL: "file:./ci.db"
        run: pnpm run build

  deploy:
    name: Deploy to production
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Load SSH deploy key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin the host key so the deploy cannot be redirected to another box.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run deployment
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          REF: ${{ github.sha }}
          SEED_MODE: ${{ inputs.seed_mode || 'if-missing' }}
          # The invitation — child, parents, hours, addresses — as a dotenv
          # block of NEXT_PUBLIC_EVENT_* lines. It is a secret rather than a
          # file in the repository, and base64 keeps quotes, accents and line
          # breaks intact on their way through ssh.
          EVENT_ENV: ${{ secrets.EVENT_ENV }}
        run: |
          if [ -z "$EVENT_ENV" ]; then
            echo "::warning::EVENT_ENV is not set — the site will deploy with the fictional christening"
          fi
          EVENT_ENV_B64="$(printf '%s\n' "$EVENT_ENV" | base64 | tr -d '\n')"
          # Pipe the script from this checkout rather than running the copy on
          # the server: the deploy logic then always matches the commit being
          # deployed, and a first deploy works before the server has the file.
          ssh -o BatchMode=yes "$USER@$HOST" \
            "SEED_MODE='$SEED_MODE' DEPLOY_REF='$REF' EVENT_ENV_B64='$EVENT_ENV_B64' bash -s" < scripts/deploy.sh

      - name: Verify the public site
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes "$USER@$HOST" \
            'curl -fsS -o /dev/null -w "app: %{http_code}\n" http://127.0.0.1:3000/'
